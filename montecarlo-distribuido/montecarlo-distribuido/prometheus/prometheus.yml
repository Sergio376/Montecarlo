global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 5s

  - job_name: workers
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 8001
        refresh_interval: 5s

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
