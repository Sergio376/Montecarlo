name: montecarlo

services:
  # ---------- Middleware: cola de mensajes ----------
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: mc
      RABBITMQ_DEFAULT_PASS: mcpass
    ports:
      - "5672:5672"
      - "15672:15672"   # panel web (mc / mcpass)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ---------- Estado: Redis primario + réplica ----------
  redis-primary:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-replica:
    image: redis:7-alpine
    command: ["redis-server", "--replicaof", "redis-primary", "6379"]
    depends_on:
      redis-primary:
        condition: service_healthy
    restart: unless-stopped

  # ---------- API REST (se puede escalar con --scale api=2) ----------
  api:
    build: ./api
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_USER: mc
      RABBIT_PASS: mcpass
      REDIS_HOST: redis-primary
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Balanceador de entrada ----------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # ---------- Nodos trabajadores ----------
  # Por defecto 2 réplicas. Para cambiar: docker compose up -d --scale worker=4
  worker:
    build: ./worker
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_USER: mc
      RABBIT_PASS: mcpass
      REDIS_HOST: redis-primary
      WORKER_PROCESSES: ${WORKER_PROCESSES:-2}
      FAIL_RATE: ${FAIL_RATE:-0}
    cpus: ${WORKER_CPUS:-2}
    deploy:
      replicas: 2
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis-primary:
        condition: service_healthy

  # ---------- Monitoreo ----------
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Opcional (métricas por contenedor). Levantar con: docker compose --profile cadvisor up -d
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ["cadvisor"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"

volumes:
  redis-data:
