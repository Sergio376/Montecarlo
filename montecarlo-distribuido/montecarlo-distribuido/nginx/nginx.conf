events {}

http {
  # DNS interno de Docker; se vuelve a resolver cada 5 s para ver réplicas nuevas de la API
  resolver 127.0.0.11 valid=5s;

  server {
    listen 80;

    location / {
      set $upstream http://api:8000;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
    }
  }
}
